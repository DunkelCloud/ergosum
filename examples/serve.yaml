# Authority instance ("ergosum serve"). All addresses are documentation
# examples (RFC 5737, RFC 3849); replace them with your own.

# Origin of this instance's journal events; unique per instance.
instance: authority-a

# SPIFFE trust domain: tokens carry sub = spiffe://<trust_domain>/host/<identity>.
trust_domain: example.com

# Shared by all instances; Vault checks it with bound_issuer.
issuer: https://ergosum.example.com
audience: vault
token_ttl: 30m
clock_skew: 2m

# Created with "ergosum keygen -out /etc/ergosum/signing.key [-encrypt]".
# An encrypted key keeps the instance sealed after every start until
# "ergosum unseal" is run on this host.
signing_key: /etc/ergosum/signing.key
journal: /var/lib/ergosum-authority/journal.db
# Local socket for "ergosum unseal" and "ergosum journal" (mode 0600).
control_socket: /var/lib/ergosum-authority/control.sock

# Token requests and binding writes (TLS with the instance key). Required:
# the instance's overlay address. Binding all interfaces (":7432") needs
# listen_all_interfaces: true.
listen: "100.64.0.10:7432"
# Metrics, health and public keys over plain HTTP.
ops_listen: "127.0.0.1:7434"

# Every instance of the trust domain with the URLs daemons reach it on
# (examples/authorities.yaml), served at /v1/authorities. The same file on
# every instance; it must name this one. Optional.
authorities_file: /etc/ergosum/authorities.yaml

callbacks:
  # Daemon callback port, unless a binding target names its own port.
  port: 7433
  timeout: 5s
  tailnet:
    # Overlay address ranges; tailnet callbacks must land inside them.
    prefixes: ["100.64.0.0/10", "fd7a:115c:a1e0::/48"]
  ip:
    # Public source address and interface for ip callbacks. On a shared host
    # this keeps the overlay or an exit node from rerouting the callback.
    source: 203.0.113.2
    # interface: eth0
  # Networks attached directly to this instance. A net check runs only for
  # prefixes inside one of them; other instances answer "not responsible".
  networks:
    - cidr: 198.51.100.0/24
      source: 198.51.100.2
      # interface: eth1

# Admin public key registry: the trust root for binding events.
registry:
  # Example keys whose private halves were discarded; use your own. Security
  # keys (sk-ssh-ed25519@openssh.com, sk-ecdsa-sha2-nistp256@openssh.com)
  # work as well and must assert user presence.
  admins:
    alice: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGhhE9xBmqGlXGkvrNVR5964nFH6sZdjiiqqIbWHYB0U alice@example.com"
    bob: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDQol2F1yMz4JOv2wBtXVnG8226P3Z4XjLZKihXRAb9z bob@example.com"
  approvals:
    binding.set:
      threshold: 2
      keys: [alice, bob]
    binding.revoked:
      threshold: 1
      keys: [alice, bob]

# Journal replication with the other instances (mutual TLS with the
# instance keys, port 7435). Every instance lists all others: their keys
# verify the observations and checkpoints that reach this instance, also
# through a third one.
replication:
  listen: "100.64.0.10:7435"
  peers:
    - name: authority-b
      url: https://100.64.0.11:7435
      # Public key as printed by "ergosum keygen" on that instance; the
      # fingerprint is optional and must match the key.
      fingerprint: SHA256:vswV23fZQ7IenAozm5haCGS9fD4JU7/wN1Hw2jxB3mc
      key: |
        -----BEGIN PUBLIC KEY-----
        MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEaZjaJWphXwUxBJc8PqqwIeKZaxuL
        bbQp94Nl0sHkl8VEUr8Luu9ddfSg8noe/RblLEjy0EiDssHIrktAEuBgbg==
        -----END PUBLIC KEY-----
    # Without url: known, but reached only through the other peers. It gets
    # no pushes from here, and compaction does not wait for it. An instance
    # that is gone for good stays listed with "retired: true" and no url.
    - name: authority-c
      key: |
        -----BEGIN PUBLIC KEY-----
        MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEFkxhJMwH+WbvoKV1FSty848J48JD
        KvE9zhKhzYFUT2Gjk9vPFJL9SysFVFiQfJIo0R2ipkXwX2y53Gbww77UWQ==
        -----END PUBLIC KEY-----
  # Largest page sent to and accepted from a peer, in MiB; the same on every
  # instance. A checkpoint (about 1.6 KB per identity) must fit into one.
  max_page_mib: 32

# Checkpoints and compaction. An event is deleted only when the latest own
# checkpoint that every peer has acknowledged covers it, every peer has
# acknowledged the event, and its retention has passed.
compaction:
  checkpoint_interval: 24h
  interval: 1h
  retention:
    observations: 2160h   # 90 days; key_duplicate and bindings are kept
    # key_duplicate: 0s   # 0 keeps them
    # bindings: 0s
  # Export events here (JSON lines) before they are deleted. Under systemd
  # a directory outside /var/lib/ergosum-authority needs ReadWritePaths=.
  # archive: /var/lib/ergosum-authority/archive
