# Machine daemon (ergosumd). All addresses are documentation examples.

# The machine's identity (FQDN). It must match the binding.
identity: host1.example.com

state_dir: /var/lib/ergosum
token_file: /run/ergosum/token
# Group of the token file (mode 0640); put Vault Agent's user into it.
token_group: ergosum-token
# node_exporter textfile collector; leave empty to disable.
metrics_file: /var/lib/node_exporter/textfile_collector/ergosum.prom

# Opened only while a request is in flight. Allow the authorities' source
# addresses in the firewall.
callback_listen: ":7433"

# Underlay addresses reported for net checks. Empty: all global unicast
# addresses outside the overlay.
addresses: []
# Overlay ranges left out of the detected addresses. Empty: the Tailscale
# ranges 100.64.0.0/10 and fd7a:115c:a1e0::/48.
overlay_prefixes: []

# Tried in order. key is the fingerprint printed by "ergosum keygen".
authorities:
  - url: https://authority-a.example.com:7432
    key: "SHA256:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
  - url: https://authority-b.example.com:7432
    key: "SHA256:BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB"
