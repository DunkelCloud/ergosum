# Machine daemon (ergosumd). All addresses are documentation examples.

# The machine's identity (FQDN). It must match the binding.
identity: host1.example.com

# Defaults on macOS: /var/db/ergosum/state and /var/db/ergosum/token.
state_dir: /var/lib/ergosum
token_file: /run/ergosum/token
# Group of the token file (mode 0640); put Vault Agent's user into it.
token_group: ergosum-token
# node_exporter textfile collector; leave empty to disable.
metrics_file: /var/lib/node_exporter/textfile_collector/ergosum.prom

# Opened only while a request is in flight. Allow the authorities' source
# addresses in the firewall.
callback_listen: ":7433"

# Underlay addresses reported for net checks. Empty: all global unicast
# addresses outside the overlay, physical-looking interfaces first, at most
# 16 (the daemon warns when it has to leave some out; name them here then).
addresses: []
# Overlay ranges left out of the detected addresses. Empty: the Tailscale
# ranges 100.64.0.0/10 and fd7a:115c:a1e0::/48.
overlay_prefixes: []

# One authority is enough: after the first token the daemon takes the
# list of all instances that the authorities serve (/v1/authorities),
# keeps it in state_dir and uses it from then on; these stay as the way
# back. Before the first token it takes the list from an authority that
# cannot run the machine's net checks or ip checks on private addresses.
# key is the fingerprint printed by "ergosum keygen". urls are tried
# in order, those the machine cannot reach from its addresses not at all
# (an overlay address needs an overlay address here, IPv4 an IPv4 address,
# IPv6 an IPv6 address). Prefer addresses to names: a name makes renewal
# depend on DNS.
authorities:
  - key: "SHA256:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
    urls:
      - https://100.64.0.10:7432
      - https://192.0.2.10:7432

# Secrets without Vault ("ergosumd secret", ADR 0004). The CLI talks to the
# running daemon over this socket. Default: secret.sock next to token_file;
# "-" disables it. Mode 0600 (root and the daemon's user); a group opens it
# to that group's members, mode 0660, and the daemon's user must be a member
# (systemd: SupplementaryGroups=). Every secret opened costs exchanges out of
# the identity's rate budget at the authorities.
# secret_socket: /run/ergosum/secret.sock
# secret_socket_group: ""
