# systemd-sysusers(8): the daemon's user and the group allowed to read the
# token, and the authority's user. On a shared host the two services must
# not reach each other's keys.
g ergosum-token - -
u ergosum - "ergosum" /var/lib/ergosum /usr/sbin/nologin
m ergosum ergosum-token
u ergosum-authority - "ergosum authority" /var/lib/ergosum-authority /usr/sbin/nologin
