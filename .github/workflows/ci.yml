name: CI

on:
  push:
    branches: [main]
  # Every pull request, also those stacked on another branch.
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.26"

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history so gitleaks can scan past commits
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
      - name: Scan git history for secrets
        run: ./gitleaks git --no-banner --redact --verbose .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: golangci/golangci-lint-action@v9
        with:
          # Pinned; bump deliberately together with any cleanup it requires.
          version: v2.12.2

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...

  netns:
    # The real binaries in Linux network namespaces: sealed start and
    # unseal, an SSH-signed binding, issuance with a net check, and a clone
    # in another segment that is refused; then three instances replicating
    # the journal: four-eyes approval with ergosum bind, catch-up
    # after an outage, convergence after a partition, compaction, and a new
    # instance built from a sync.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build
        run: CGO_ENABLED=0 go build -o dist/ ./cmd/...
      - name: Integration test in network namespaces
        run: sudo BIN="$PWD/dist" bash test/netns/run.sh
      - name: Journal replication in network namespaces
        run: sudo BIN="$PWD/dist" bash test/netns/replication.sh

  vault:
    # The Vault side with the real binaries, a Vault dev server and Vault
    # Agent in network namespaces: deploy/vault/machine-auth.sh next to
    # configuration it must not touch, refused tokens (audience, issuer,
    # unknown key, identity not admitted), secrets of other machines out of
    # reach, rendered backup settings and a restic backup with them, a new
    # login after the token's max TTL, a key change and the rollback.
    runs-on: ubuntu-latest
    env:
      # Pinned; bump deliberately.
      VAULT_VERSION: "1.19.2"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build
        run: CGO_ENABLED=0 go build -o dist/ ./cmd/...
      - name: Install Vault and restic
        run: |
          mkdir -p tools
          cd tools
          curl -sSfLO "https://releases.hashicorp.com/vault/${VAULT_VERSION}/vault_${VAULT_VERSION}_linux_amd64.zip"
          curl -sSfL "https://releases.hashicorp.com/vault/${VAULT_VERSION}/vault_${VAULT_VERSION}_SHA256SUMS" \
            | grep '_linux_amd64.zip$' | sha256sum -c -
          unzip -q "vault_${VAULT_VERSION}_linux_amd64.zip" vault
          sudo apt-get update -qq
          sudo apt-get install -y -qq restic
      - name: Vault and Vault Agent in network namespaces
        run: sudo BIN="$PWD/dist" VAULT_BIN="$PWD/tools/vault" bash test/vault/run.sh

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          # Administrators' machines need only the administrator tool.
          - {goos: windows, goarch: amd64, admin: true}
          - {goos: windows, goarch: arm64, admin: true}
          - {goos: darwin, goarch: amd64, admin: true}
          - {goos: darwin, goarch: arm64, admin: true}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build static binaries
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ADMIN_ONLY: ${{ matrix.admin }}
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X github.com/DunkelCloud/ergosum/internal/version.Version=${GITHUB_REF_NAME} -X github.com/DunkelCloud/ergosum/internal/version.Commit=${GITHUB_SHA}"
          EXT=""
          [ "$GOOS" = windows ] && EXT=.exe
          go build -trimpath -ldflags "${LDFLAGS}" -o "dist/ergosum${EXT}" ./cmd/ergosum
          [ "$ADMIN_ONLY" = true ] || go build -trimpath -ldflags "${LDFLAGS}" -o dist/ergosumd ./cmd/ergosumd
      - name: Check that the binaries are static
        if: matrix.goos == 'linux'
        run: |
          for b in dist/*; do
            file "$b"
            file "$b" | grep -q 'statically linked'
          done
      - uses: actions/upload-artifact@v5
        with:
          name: ergosum-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          retention-days: 14

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      # The builder stage runs on the native platform and Go cross-compiles,
      # so no emulation is needed for the arm64 image.
      - name: Build image (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Load amd64 image for a smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ergosum:ci
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
      - name: Smoke test (non-root, read-only root filesystem)
        run: |
          docker run --rm --read-only ergosum:ci version
          test "$(docker image inspect ergosum:ci --format '{{.Config.User}}')" = "65532:65532"
