name: CI

on:
  push:
    branches: [main]
  # Every pull request, also those stacked on another branch.
  pull_request:

permissions:
  contents: read

# Actions are pinned by commit, downloaded tools by checksum, and Go comes
# from the toolchain line in go.mod; bump them deliberately.
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # full history so gitleaks can scan past commits
          persist-credentials: false
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan git history for secrets
        run: ./gitleaks git --no-banner --redact --verbose .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

  vulncheck:
    # Known vulnerabilities in code this module calls, in its dependencies
    # and in the standard library of the toolchain. "go run" checks the
    # module against the checksum database.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...

  install:
    # A new machine set up by deploy/install.sh from a downloaded, signed
    # release, in Debian, Ubuntu 20.04 and Alpine containers: users, state
    # directory, service, release keys, configuration, binding request, a
    # second run that keeps everything, and refused runs that change nothing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Build
        run: VERSION=v0.1.0 scripts/build.sh dist ergosumd
      - name: First installation in containers
        run: BIN="$PWD/dist" bash test/install/run.sh

  install-macos:
    # A Mac set up by deploy/install.sh on the runner itself, Apple Silicon
    # and Intel: the user and groups in the directory service, the launchd
    # job, refused runs that change nothing; then a token from an authority
    # on the same Mac, group-owned by ergosum-token, and an update through
    # launchctl that waits for a new one.
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Test without cgo, as released
        # macOS's TMPDIR (/var/folders/...) and a long test name make the
        # authority's control socket path longer than the 104 bytes macOS
        # allows; /tmp keeps it short.
        env:
          TMPDIR: /tmp
        run: CGO_ENABLED=0 go test -count=1 -timeout 5m ./...
      - name: Build
        run: |
          VERSION=v0.1.0 scripts/build.sh dist
          VERSION=v0.2.0 scripts/build.sh dist-next ergosumd
      - name: First installation, token and update
        run: sudo env PATH="$PATH" BIN="$PWD/dist" NEXT="$PWD/dist-next" bash test/install/macos.sh

  netns:
    # The real binaries in Linux network namespaces: sealed start and
    # unseal, an SSH-signed binding, issuance with a net check, a clone
    # in another segment that is refused, and updates with
    # deploy/install.sh; then three instances replicating the journal:
    # four-eyes approval with ergosum bind, catch-up after an outage,
    # convergence after a partition, compaction, and a new instance built
    # from a sync.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Build
        # Two release versions, so that install.sh can update from one to
        # the other and refuse the way back.
        run: |
          VERSION=v0.1.0 scripts/build.sh dist
          VERSION=v0.2.0 scripts/build.sh dist-next ergosumd
      - name: Integration test in network namespaces
        run: sudo BIN="$PWD/dist" NEXT="$PWD/dist-next" bash test/netns/run.sh
      - name: Journal replication in network namespaces
        run: sudo BIN="$PWD/dist" bash test/netns/replication.sh

  vault:
    # The Vault side with the real binaries, a Vault dev server and Vault
    # Agent in network namespaces: deploy/vault/machine-auth.sh next to
    # configuration it must not touch, refused tokens (audience, issuer,
    # unknown key, identity not admitted), secrets of other machines out of
    # reach, rendered backup settings and a restic backup with them, a new
    # login after the token's max TTL, a key change and the rollback.
    runs-on: ubuntu-latest
    env:
      VAULT_VERSION: "1.19.2"
      # From HashiCorp's SHA256SUMS, checked against their signature when
      # pinned.
      VAULT_SHA256: c6781c3e0ec431f39bcc8f1443d09f3b8944c90c348e91aa13182b4e1fd2797f
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Build
        run: scripts/build.sh dist
      - name: Install Vault and restic
        run: |
          mkdir -p tools
          cd tools
          curl -sSfLO "https://releases.hashicorp.com/vault/${VAULT_VERSION}/vault_${VAULT_VERSION}_linux_amd64.zip"
          echo "${VAULT_SHA256}  vault_${VAULT_VERSION}_linux_amd64.zip" | sha256sum -c -
          unzip -q "vault_${VAULT_VERSION}_linux_amd64.zip" vault
          sudo apt-get update -qq
          sudo apt-get install -y -qq restic
      - name: Vault and Vault Agent in network namespaces
        run: sudo BIN="$PWD/dist" VAULT_BIN="$PWD/tools/vault" bash test/vault/run.sh

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
          # Administrators' Windows machines need only the administrator tool.
          - {goos: windows, goarch: amd64, admin: true}
          - {goos: windows, goarch: arm64, admin: true}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          # Artifacts are built without a cache that other jobs fill.
          cache: false
      - name: Build static binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          ADMIN_ONLY: ${{ matrix.admin }}
        run: |
          if [ "$ADMIN_ONLY" = true ]; then
            scripts/build.sh dist ergosum
          else
            scripts/build.sh dist
          fi
          sha256sum dist/*
      - name: Check that the binaries are static
        if: matrix.goos == 'linux'
        run: |
          for b in dist/*; do
            file "$b"
            file "$b" | grep -q 'statically linked'
          done
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ergosum-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          retention-days: 14

  image:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
      COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Builder image matches the toolchain
        run: |
          toolchain=$(sed -n 's/^toolchain go//p' go.mod)
          image=$(sed -n 's/^FROM .*golang:\([0-9.]*\)-alpine@sha256:.*/\1/p' Dockerfile)
          echo "go.mod: $toolchain, Dockerfile: $image"
          test -n "$toolchain" && test "$toolchain" = "$image"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      # The builder stage runs on the native platform and Go cross-compiles,
      # so no emulation is needed for the arm64 image. No build cache: what
      # one run leaves there must not end up in another's image.
      - name: Build image (linux/amd64, linux/arm64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ env.COMMIT }}
      - name: Load amd64 image for a smoke test
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ergosum:ci
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ env.COMMIT }}
      - name: Smoke test (non-root, read-only root filesystem)
        run: |
          docker run --rm --read-only ergosum:ci version
          test "$(docker image inspect ergosum:ci --format '{{.Config.User}}')" = "65532:65532"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Image carries the same binary as a build outside it
        run: |
          GOOS=linux GOARCH=amd64 scripts/build.sh dist ergosum
          id=$(docker create ergosum:ci)
          docker cp "$id:/usr/bin/ergosum" image-ergosum
          docker rm "$id"
          sha256sum dist/ergosum image-ergosum
          cmp dist/ergosum image-ergosum
